version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      non-major-development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
